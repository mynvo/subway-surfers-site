<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Subway Surfers - Mynvo Edition</title>
    <link rel="icon" href="img/FirstAvatar.png">

    <script type="text/javascript" src="4399.z.js"></script>
    <script>
      window.config = {
        loader: "unity",
        debug: false,
        maxRatio: 16 / 9,
        minRatio: 9 / 16,
        title: "Subway Surfers: San Francisco",
        unityVersion: "2019.4.18f1",
        unityWebglBuildUrl: "Build/SanFrancisco.json",
        fileSize: 35,
        cachedDecompressedFileSizes: {
          "SanFrancisco.asm.code.unityweb": 9077143,
          "SanFrancisco.asm.framework.unityweb": 86369,
          "SanFrancisco.asm.memory.unityweb": 951447,
          "SanFrancisco.data.unityweb": 18323917,
          "SanFrancisco.wasm.code.unityweb": 7279617,
          "SanFrancisco.wasm.framework.unityweb": 90693,
        },
      };
    </script>
  </head>

  <body style="margin:0; overflow:hidden; background:#000;">
    <script src="master-loader.js"></script>
    <script>
    (function(){
      var canvas = null;

      // Map de conversion ZQSD -> Flèches
      const controlsMap = { 
          'Z': { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 }, 
          'S': { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 }, 
          'Q': { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 }, 
          'D': { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 } 
      };

      // Gestionnaire de touches
      function handleKeyEvent(e) {
        const keyUpper = e.key.toUpperCase();
        
        // 1. Envoi au site parent (ton dossier racine /index.html) pour le Timer
        try { 
            window.parent.postMessage({ type: e.type, key: e.key }, '*'); 
        } catch(err) {}

        // 2. Conversion ZQSD pour Unity
        if (controlsMap[keyUpper]) {
            const trans = controlsMap[keyUpper];
            
            // On crée un nouvel événement clavier "Flèche"
            const event = new KeyboardEvent(e.type, {
                key: trans.key,
                code: trans.code,
                keyCode: trans.keyCode,
                which: trans.keyCode,
                bubbles: true,
                cancelable: true
            });

            // On l'envoie au jeu
            const target = document.querySelector('canvas') || document;
            target.dispatchEvent(event);

            // Empêche le conflit (évite que Z fasse autre chose dans le navigateur)
            if(e.type === 'keydown') e.preventDefault();
        }
      }

      window.addEventListener('keydown', handleKeyEvent, true);
      window.addEventListener('keyup', handleKeyEvent, true);

      // --- COMMANDES DE TRICHE (Pièces / Clés) ---
      function writeSaves(mut){
        var keys=['subway-surfers-v1-data','SubwaySurfersData','ss_data'];
        keys.forEach(function(k){
          var d={};
          try{ d=JSON.parse(localStorage.getItem(k)||'{}'); }catch(_){}
          Object.keys(mut).forEach(function(m){ d[m]=mut[m]; });
          localStorage.setItem(k, JSON.stringify(d));
        });
      }

      window.addEventListener('message', function(e){
        if(e.data && e.data.type === 'MynvoCommand'){
          const c = e.data.command;
          const p = e.data.payload || {};
          if(c === 'unlockAll'){
            writeSaves({ coins: 999999, keys: 9999, unlockAll: true });
            alert("Cheat activé ! Relance le jeu.");
          }
        }
      });

    })();
    </script>
  </body>
</html>
