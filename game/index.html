<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Subway Surfers</title>
    <link rel="icon" href="img/FirstAvatar.png">

    <script type="text/javascript" src="4399.z.js"></script>
    <script>
      window.config = {
        loader: "unity",
        debug: false,
        maxRatio: 16 / 9,
        minRatio: 9 / 16,
        title: "Subway Surfers: San Francisco",
        unityVersion: "2019.4.18f1",
        unityWebglBuildUrl: "Build/SanFrancisco.json",
        fileSize: 35,
        cachedDecompressedFileSizes: {
          "SanFrancisco.asm.code.unityweb": 9077143,
          "SanFrancisco.asm.framework.unityweb": 86369,
          "SanFrancisco.asm.memory.unityweb": 951447,
          "SanFrancisco.data.unityweb": 18323917,
          "SanFrancisco.wasm.code.unityweb": 7279617,
          "SanFrancisco.wasm.framework.unityweb": 90693,
        },
      };
    </script>
  </head>

  <body>
    <script src="master-loader.js"></script>
    <script>
    (function(){
      var canvas=null;

      // Map de conversion ZQSD vers Flèches
      const controlsMap = { 
          'Z': { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 }, 
          'S': { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 }, 
          'Q': { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 }, 
          'D': { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 } 
      };

      // --- ECOUTEUR DES TOUCHES (KEYDOWN & KEYUP) ---
      function handleKeyEvent(e) {
        const keyUpper = e.key.toUpperCase();
        
        // 1. Envoyer au parent (Timer) - On envoie l'événement d'origine
        try { 
            window.parent.postMessage({ type: e.type, key: e.key, code: e.code }, '*'); 
        } catch(err) {}

        // 2. Traduction ZQSD pour Unity
        if (controlsMap[keyUpper]) {
            const translated = controlsMap[keyUpper];
            dispatch(e.type, translated.key, translated.code, translated.keyCode);
            
            // Empêche le navigateur de faire défiler la page avec les touches
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(translated.code)) {
                e.preventDefault();
            }
        }
      }

      window.addEventListener('keydown', handleKeyEvent, true);
      window.addEventListener('keyup', handleKeyEvent, true);

      function getCanvas(){
        if(canvas && document.body.contains(canvas)) return canvas;
        canvas = document.querySelector('canvas') || document.querySelector('#unity-canvas');
        return canvas || document.body;
      }

      function dispatch(type, key, code, keyCode){
        const targetCanvas = getCanvas();
        const targets = [window, document, targetCanvas];
        
        const event = new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true
        });
        
        targets.forEach(function(t){
          try { t.dispatchEvent(event); } catch(_) {}
        });
      }

      // --- SYSTÈME DE SAUVEGARDE ET COMMANDES (MYNVO) ---
      function sendAck(msg, ok){
        try{ parent.postMessage({type:'MynvoAck', message:msg, success:!!ok}, '*'); }catch(_){}
      }

      function writeSaves(mut){
        var keys=['subway-surfers-v1-data','SubwaySurfersData','ss_data','ss_save_data'];
        keys.forEach(function(k){
          var d={};
          try{ d=JSON.parse(localStorage.getItem(k)||'{}'); }catch(_){}
          Object.keys(mut).forEach(function(m){ d[m]=mut[m]; });
          localStorage.setItem(k, JSON.stringify(d));
        });
      }

      window.addEventListener('message', function(e){
        var data = e.data || {};
        // Commandes reçues depuis le site parent (index.html racine)
        if(data.type === 'MynvoCommand'){
          var c = data.command, p = data.payload || {};
          if(c === 'setCoins'){ 
             writeSaves({coins: p.amount || 999999}); 
             sendAck('Pièces définies !', true); 
          }
          else if(c === 'setKeys'){ 
             writeSaves({keys: p.amount || 999}); 
             sendAck('Clés définies !', true); 
          }
          else if(c === 'unlockAll'){
            writeSaves({
                coins: 99999999, 
                keys: 999999, 
                charactersUnlocked: true, 
                unlockAll: true,
                scores: [9999999]
            });
            sendAck('Tout est débloqué ! Relancez le jeu.', true);
          }
        }
      });

      // Nettoyage console pour éviter les logs inutiles
      console.log("🎮 Subway Surfers Game Engine Ready");
    })();
    </script>
  </body>
</html>
