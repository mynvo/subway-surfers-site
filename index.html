<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers by Mynvo - Pro Edition 2025</title>
    <style>
        :root {
            --primary: #7c62dc;
            --primary-glow: rgba(124, 98, 220, 0.5);
            --bg-dark: #0a0a0a;
            --bg-card: rgba(20, 20, 25, 0.95);
            --text-light: #f0f0f0;
            --success: #00ff88;
        }

        .theme-violet { --primary: #7c62dc; --primary-glow: rgba(124, 98, 220, 0.5); }
        .theme-blue { --primary: #00a2ff; --primary-glow: rgba(0, 162, 255, 0.5); }
        .theme-red { --primary: #ff4444; --primary-glow: rgba(255, 68, 68, 0.5); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        /* --- GAME AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 12px;
            background: #000;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        /* --- OVERLAYS (Livesplit Style) --- */
        .overlay {
            position: absolute;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--primary);
            padding: 10px 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }
        #fps-box { top: 15px; left: 15px; color: var(--success); font-weight: bold; }
        
        #timer-box { 
            bottom: 20px; 
            right: 20px; 
            min-width: 180px; 
            text-align: right;
            border-right: 4px solid var(--primary);
        }
        #timer-val { font-size: 28px; font-weight: bold; color: #fff; }
        #timer-label { font-size: 10px; color: var(--primary); text-transform: uppercase; }

        #top3-box { bottom: 20px; left: 20px; font-size: 13px; }

        /* --- SETTINGS MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-card); border: 2px solid var(--primary);
            padding: 30px; border-radius: 15px; width: 400px;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        input[type="text"] { 
            width: 50px; background: #000; border: 1px solid var(--primary); 
            color: #fff; text-align: center; padding: 5px; border-radius: 4px;
        }

        /* --- CONTEXT MENU --- */
        #ctx-menu {
            position: fixed; background: #151515; border: 1px solid var(--primary);
            border-radius: 5px; padding: 5px 0; display: none; z-index: 2000; min-width: 160px;
        }
        .ctx-item { padding: 8px 15px; cursor: pointer; font-size: 14px; }
        .ctx-item:hover { background: var(--primary); color: #000; }

        .btn-ui {
            background: var(--primary); color: #000; border: none;
            padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body class="theme-violet">

    <header>
        <div class="logo">🚇 SUBWAY<span>SURFERS</span></div>
        <div style="display: flex; gap: 15px;">
            <button class="btn-ui" onclick="toggleModal()">PARAMÈTRES</button>
        </div>
    </header>

    <div class="main-content">
        <div class="game-wrapper" id="capture-zone">
            <div id="fps-box" class="overlay">FPS: <span id="fps-num">60</span></div>
            
            <div id="timer-box" class="overlay">
                <div id="timer-label">Session Timer</div>
                <div id="timer-val">00:00.00</div>
            </div>

            <div id="top3-box" class="overlay">
                <div style="color: var(--primary); margin-bottom: 5px;">TOP RECORDS</div>
                <div>🥇 Mynvo: 1:22:04</div>
                <div>🥈 Player: 0:45:12</div>
            </div>

            <iframe id="game-iframe" src="https://yell0wsuit.page/games/subway-surfers/"></iframe>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 style="margin-bottom: 20px; text-align: center;">Configuration</h2>
            <div class="setting-row">
                <span>Touche Timer</span>
                <input type="text" id="cfg-timer-key" maxlength="1" value="T" oninput="updateConfig()">
            </div>
            <div class="setting-row">
                <span>Contrôles ZQSD</span>
                <input type="checkbox" id="cfg-zqsd" checked onchange="updateConfig()">
            </div>
            <button class="btn-ui" style="width: 100%;" onclick="toggleModal()">SAUVEGARDER</button>
        </div>
    </div>

    <div id="ctx-menu">
        <div class="ctx-item" onclick="resetTimer()">Réinitialiser Timer</div>
        <div class="ctx-item" onclick="toggleFS()">Plein Écran (F)</div>
        <div class="ctx-item" onclick="toggleModal()">Paramètres</div>
    </div>

    <script>
        // 1. CONFIGURATION INITIALE
        let config = {
            timerKey: 'T',
            zqsdActive: true,
            fpsActive: true
        };

        // 2. LOGIQUE DU TIMER
        let timerStart = 0, timerElapsed = 0, timerRunning = false, timerInterval;

        function toggleTimer() {
            if (!timerRunning) {
                timerStart = Date.now() - timerElapsed;
                timerInterval = setInterval(updateTimerUI, 10);
                timerRunning = true;
            } else {
                clearInterval(timerInterval);
                timerRunning = false;
            }
        }

        function updateTimerUI() {
            timerElapsed = Date.now() - timerStart;
            let time = new Date(timerElapsed);
            let m = String(time.getUTCMinutes()).padStart(2, '0');
            let s = String(time.getUTCSeconds()).padStart(2, '0');
            let ms = String(Math.floor(time.getUTCMilliseconds() / 10)).padStart(2, '0');
            document.getElementById('timer-val').innerText = `${m}:${s}.${ms}`;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            timerElapsed = 0;
            document.getElementById('timer-val').innerText = "00:00.00";
        }

        // 3. CAPTURE DES TOUCHES (CORRECTION ZQSD + FOCUS)
        // On utilise la phase de capture (true) pour intercepter avant l'iframe
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();

            // Timer
            if (key === config.timerKey.toUpperCase()) {
                e.preventDefault();
                toggleTimer();
            }
            if (key === 'R') resetTimer();
            if (key === 'F') toggleFS();

            // ZQSD vers Flèches
            if (config.zqsdActive) {
                const map = { 'Z': 'ArrowUp', 'S': 'ArrowDown', 'Q': 'ArrowLeft', 'D': 'ArrowRight' };
                if (map[key]) {
                    // On simule l'event pour l'iframe
                    const gameIframe = document.getElementById('game-iframe');
                    gameIframe.contentWindow.postMessage({ type: 'keydown', key: map[key] }, '*');
                    
                    // On redirige le focus si besoin
                    gameIframe.focus();
                }
            }
        }, true);

        // 4. COMPTEUR FPS
        let frames = 0, lastFpsUpdate = performance.now();
        function trackFPS() {
            frames++;
            let now = performance.now();
            if (now - lastFpsUpdate >= 1000) {
                document.getElementById('fps-num').innerText = frames;
                frames = 0;
                lastFpsUpdate = now;
            }
            requestAnimationFrame(trackFPS);
        }
        trackFPS();

        // 5. INTERFACE ET MENUS
        function toggleModal() {
            const m = document.getElementById('modal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function updateConfig() {
            config.timerKey = document.getElementById('cfg-timer-key').value || 'T';
            config.zqsdActive = document.getElementById('cfg-zqsd').checked;
        }

        function toggleFS() {
            const wrapper = document.getElementById('capture-zone');
            if (!document.fullscreenElement) wrapper.requestFullscreen();
            else document.exitFullscreen();
        }

        // Clic droit personnalisé
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            const menu = document.getElementById('ctx-menu');
            menu.style.display = 'block';
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
        });

        document.addEventListener('click', () => {
            document.getElementById('ctx-menu').style.display = 'none';
        });

        // Forcer le focus au démarrage
        window.onload = () => {
            document.getElementById('game-iframe').focus();
        };
    </script>
</body>
</html>
